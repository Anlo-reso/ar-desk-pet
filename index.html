<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AR Desk Pet</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: -apple-system, sans-serif; }
    #hud {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 999;
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 16px; box-sizing: border-box; color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,.6); pointer-events: none;
    }
    #hint {
      position: fixed; bottom: 24px; left: 0; width: 100%; text-align: center;
      color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.6); z-index: 999;
      font-size: 15px; pointer-events: none;
    }
    #hearts { font-size: 18px; font-weight: 600; }
    #level { font-size: 13px; opacity: .85; }
  </style>
</head>
<body>

  <div id="hud">
    <div id="hearts">❤️ x0</div>
    <div id="level">Level 1</div>
  </div>
  <div id="hint">Point your camera at the Hiro marker · tap the screen to feed your pet</div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true;">

    <a-marker preset="hiro" id="marker">
      <a-entity id="pet" position="0 0.6 0" scale="1 1 1">
        <!-- body -->
        <a-sphere id="body" radius="0.5" color="#7ee8c7" segments-height="18" segments-width="18"
                  animation="property: position; dir: alternate; dur: 900; easing: easeInOutSine; to: 0 0.15 0; loop: true">
        </a-sphere>
        <!-- eyes -->
        <a-sphere radius="0.08" color="#1e1e1e" position="-0.18 0.15 0.42"></a-sphere>
        <a-sphere radius="0.08" color="#1e1e1e" position="0.18 0.15 0.42"></a-sphere>
        <!-- ears -->
        <a-cone radius-bottom="0.14" radius-top="0" height="0.3" color="#7ee8c7" position="-0.35 0.55 0" rotation="0 0 -20"></a-cone>
        <a-cone radius-bottom="0.14" radius-top="0" height="0.3" color="#7ee8c7" position="0.35 0.55 0" rotation="0 0 20"></a-cone>
        <!-- cheeks -->
        <a-circle radius="0.07" color="#ff9fb0" position="-0.33 0.02 0.4" rotation="0 0 0" material="shader: flat; opacity: 0.85"></a-circle>
        <a-circle radius="0.07" color="#ff9fb0" position="0.33 0.02 0.4" rotation="0 0 0" material="shader: flat; opacity: 0.85"></a-circle>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    let hearts = 0;
    let level = 1;
    const colors = ['#7ee8c7', '#ffd166', '#ef476f', '#8ecae6', '#c77dff'];

    const heartsEl = document.getElementById('hearts');
    const levelEl = document.getElementById('level');

    // simple synth beep, no audio files needed
    function beep(freq = 520, dur = 0.12) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.connect(gain).connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur);
      } catch (e) {}
    }

    function feed() {
      hearts += 1;
      heartsEl.textContent = `❤️ x${hearts}`;
      beep(500 + hearts * 8);

      const pet = document.getElementById('pet');
      const body = document.getElementById('body');

      // pulse scale
      pet.setAttribute('animation__pulse', {
        property: 'scale',
        from: '1 1 1',
        to: '1.25 1.25 1.25',
        dur: 150,
        dir: 'alternate',
        loop: 1
      });

      // spin a little
      pet.setAttribute('animation__spin', {
        property: 'rotation',
        from: '0 0 0',
        to: '0 360 0',
        dur: 500,
        easing: 'easeOutQuad'
      });

      // level up every 5 feeds: grow + change color
      if (hearts % 5 === 0) {
        level += 1;
        levelEl.textContent = `Level ${level}`;
        const newColor = colors[level % colors.length];
        body.setAttribute('color', newColor);
        const currentScale = 1 + (level - 1) * 0.08;
        pet.setAttribute('scale', `${currentScale} ${currentScale} ${currentScale}`);
        beep(800, 0.25);
      }

      spawnFloatingHeart();
    }

    function spawnFloatingHeart() {
      const scene = document.querySelector('a-scene');
      const marker = document.getElementById('marker');
      const fx = document.createElement('a-text');
      const dx = (Math.random() - 0.5) * 0.6;
      fx.setAttribute('value', '❤');
      fx.setAttribute('color', '#ff5d8f');
      fx.setAttribute('align', 'center');
      fx.setAttribute('scale', '0.6 0.6 0.6');
      fx.setAttribute('position', `${dx} 0.6 0`);
      fx.setAttribute('animation', 'property: position; to: ' + dx + ' 1.6 0; dur: 1000; easing: easeOutQuad');
      fx.setAttribute('animation__fade', 'property: opacity; to: 0; dur: 1000; easing: linear');
      marker.appendChild(fx);
      setTimeout(() => fx.remove(), 1000);
    }

    window.addEventListener('click', feed);
    window.addEventListener('touchend', feed);
  </script>
</body>
</html>
