<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AR Cat Pet</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: -apple-system, sans-serif; }
    #hud {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 999;
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 16px; box-sizing: border-box; color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,.6); pointer-events: none;
    }
    #mood-label {
      position: fixed; top: 46px; left: 0; width: 100%; text-align: center;
      color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.6); z-index: 999;
      font-size: 13px; pointer-events: none; opacity: 0.9;
    }
    #hint {
      position: fixed; bottom: 84px; left: 0; width: 100%; text-align: center;
      color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.6); z-index: 999;
      font-size: 14px; pointer-events: none;
    }
    #feed-btn {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 999; pointer-events: auto; border: none; border-radius: 24px;
      padding: 12px 28px; font-size: 16px; font-weight: 600;
      background: rgba(0,0,0,0.55); color: #fff;
    }
    #hearts { font-size: 18px; font-weight: 600; }
    #level { font-size: 13px; opacity: .85; }
  </style>
</head>
<body>

  <div id="hud">
    <div id="hearts">❤️ x0</div>
    <div id="level">Level 1</div>
  </div>
  <div id="mood-label">curious</div>
  <div id="hint">Point at the Hiro marker · tap the cat to pet it</div>
  <button id="feed-btn">Feed</button>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true;">

    <a-marker preset="hiro" id="marker">
      <a-entity id="pet" class="clickable" position="0 0 0" scale="1 1 1">

        <a-entity id="model-wrap" look-toward="target: [camera]; maxDeg: 18; speed: 0.04">
          <a-entity id="cat-model"
                    gltf-model="url(https://static.poly.pizza/67f5e3fe-37ee-4c86-95c8-d269d8c9f8ba.glb)"
                    position="0 0 0" rotation="0 0 0" scale="0.5 0.5 0.5"></a-entity>
          <a-entity id="face" position="0 0.35 0.22">
            <a-sphere id="eye-l" radius="0.045" color="#1a1a1a" position="-0.09 0 0"></a-sphere>
            <a-sphere id="eye-r" radius="0.045" color="#1a1a1a" position="0.09 0 0"></a-sphere>
          </a-entity>
        </a-entity>

        <a-torus id="bandana" color="#D4537E" radius="0.14" radius-tubular="0.022"
                 position="0 0.3 0.08" rotation="85 0 0" scale="0.001 0.001 0.001"></a-torus>
        <a-sphere id="bell" radius="0.028" color="#F0997B" position="0 0.18 0.15" scale="0.001 0.001 0.001"></a-sphere>
      </a-entity>
    </a-marker>

    <a-entity light="type: ambient; intensity: 0.9"></a-entity>
    <a-entity light="type: directional; intensity: 0.6" position="1 2 1"></a-entity>
    <a-entity camera cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .clickable"></a-entity>
  </a-scene>

  <script>
    var THREE = AFRAME.THREE;

    AFRAME.registerComponent('look-toward', {
      schema: { target: { type: 'selector' }, maxDeg: { default: 20 }, speed: { default: 0.05 } },
      init: function () {
        this.tmpA = new THREE.Vector3();
        this.tmpB = new THREE.Vector3();
      },
      tick: function () {
        var targetEl = this.data.target;
        if (!targetEl || !targetEl.object3D || !this.el.object3D.parent) return;
        var headObj = this.el.object3D;
        var parent = headObj.parent;
        headObj.getWorldPosition(this.tmpA);
        targetEl.object3D.getWorldPosition(this.tmpB);
        var localSelf = parent.worldToLocal(this.tmpA.clone());
        var localTarget = parent.worldToLocal(this.tmpB.clone());
        var dx = localTarget.x - localSelf.x;
        var dz = localTarget.z - localSelf.z;
        var yaw = Math.atan2(dx, dz);
        var maxRad = this.data.maxDeg * Math.PI / 180;
        yaw = Math.max(-maxRad, Math.min(maxRad, yaw));
        headObj.rotation.y += (yaw - headObj.rotation.y) * this.data.speed;
      }
    });
  </script>

  <script>
    (function () {
      var hearts = 0, level = 1, scale = 1;
      var heartsEl = document.getElementById('hearts');
      var levelEl = document.getElementById('level');
      var moodEl = document.getElementById('mood-label');
      var marker = document.getElementById('marker');
      var petEl = document.getElementById('pet');
      var catModelEl = document.getElementById('cat-model');
      var bandana = document.getElementById('bandana');
      var bell = document.getElementById('bell');

      var mixer = null;
      var idleAction = null;
      var sleepAction = null;
      var clock = new THREE.Clock();
      var CAT_COLOR = '#EF9F27';
      var eyeL = document.getElementById('eye-l');
      var eyeR = document.getElementById('eye-r');

      catModelEl.addEventListener('model-loaded', function (e) {
        var model = e.detail.model;
        if (!model) return;

        model.traverse(function (node) {
          if (node.isMesh && node.material) {
            var mats = Array.isArray(node.material) ? node.material : [node.material];
            mats.forEach(function (m) {
              if (m.color) m.color.set(CAT_COLOR);
            });
          }
        });

        if (model.animations && model.animations.length) {
          mixer = new THREE.AnimationMixer(model);
          var idleClip = model.animations.find(function (c) {
            return /idle|walk|stand/i.test(c.name);
          });
          var sleepClip = model.animations.find(function (c) {
            return /sleep|sit|lay|rest|down/i.test(c.name);
          });
          if (idleClip) { idleAction = mixer.clipAction(idleClip); idleAction.play(); }
          if (sleepClip) { sleepAction = mixer.clipAction(sleepClip); }
        }
      });

      function closeEyes() {
        eyeL.setAttribute('scale', '1 0.12 1');
        eyeR.setAttribute('scale', '1 0.12 1');
      }

      function openEyes() {
        eyeL.setAttribute('scale', '1 1 1');
        eyeR.setAttribute('scale', '1 1 1');
      }

      (function animate() {
        if (mixer) mixer.update(clock.getDelta());
        requestAnimationFrame(animate);
      })();

      function beep(freq, dur) {
        freq = freq || 520; dur = dur || 0.12;
        try {
          var ctx = new (window.AudioContext || window.webkitAudioContext)();
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
          osc.connect(gain).connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + dur);
        } catch (e) {}
      }

      function setMood(text) { moodEl.textContent = text; }

      function spawnText(value, color, y0, y1, dur) {
        var dx = (Math.random() - 0.5) * 0.3;
        var el = document.createElement('a-text');
        el.setAttribute('value', value);
        el.setAttribute('color', color);
        el.setAttribute('align', 'center');
        el.setAttribute('scale', '0.4 0.4 0.4');
        el.setAttribute('position', dx + ' ' + y0 + ' 0.3');
        el.setAttribute('animation', 'property: position; to: ' + dx + ' ' + y1 + ' 0.3; dur: ' + dur + '; easing: easeOutQuad');
        el.setAttribute('animation__fade', 'property: opacity; to: 0; dur: ' + dur + '; easing: linear');
        marker.appendChild(el);
        setTimeout(function () { el.remove(); }, dur);
      }

      function spawnSnack() {
        var s = document.createElement('a-sphere');
        s.setAttribute('radius', '0.05');
        s.setAttribute('color', '#993C1D');
        s.setAttribute('position', '0 0 0.5');
        s.setAttribute('animation', 'property: position; to: 0 0.4 0.15; dur: 400; easing: easeInQuad');
        s.setAttribute('animation__fade', 'property: opacity; to: 0; dur: 150; delay: 300');
        marker.appendChild(s);
        setTimeout(function () { s.remove(); }, 500);
      }

      var idleState = 'active';
      var lastInteraction = Date.now();
      var zzzTimer = null;

      function wake() {
        if (zzzTimer) { clearInterval(zzzTimer); zzzTimer = null; }
        petEl.setAttribute('scale', scale + ' ' + scale + ' ' + scale);
        openEyes();
        if (mixer) {
          mixer.timeScale = 1;
          if (sleepAction && idleAction) {
            sleepAction.fadeOut(0.3);
            idleAction.reset().fadeIn(0.3).play();
          }
        }
      }

      function resetIdle() {
        if (idleState === 'napping') wake();
        idleState = 'active';
        lastInteraction = Date.now();
      }

      function groom() {
        setMood('bored');
        var s = scale * 1.04;
        petEl.setAttribute('animation__groom', {
          property: 'scale', from: scale + ' ' + scale + ' ' + scale,
          to: s + ' ' + s + ' ' + s, dir: 'alternate', dur: 250, loop: 2
        });
      }

      function yawn() {
        setMood('hungry');
        spawnText('meow?', '#ffffff', 0.7, 0.95, 800);
        closeEyes();
        if (mixer) mixer.timeScale = 0.5;
        setTimeout(function () {
          openEyes();
          if (mixer && idleState !== 'napping') mixer.timeScale = 1;
        }, 700);
      }

      function nap() {
        idleState = 'napping';
        setMood('sleeping');
        petEl.setAttribute('scale', (scale * 0.94) + ' ' + (scale * 0.94) + ' ' + (scale * 0.94));
        closeEyes();
        if (mixer) {
          if (sleepAction && idleAction) {
            idleAction.fadeOut(0.3);
            sleepAction.reset().fadeIn(0.3).play();
          } else {
            mixer.timeScale = 0.08;
          }
        }
        spawnText('z', '#dddddd', 0.7, 1.1, 1300);
        zzzTimer = setInterval(function () { spawnText('z', '#dddddd', 0.7, 1.1, 1300); }, 1300);
      }

      setInterval(function () {
        if (idleState === 'napping') return;
        var idleSec = (Date.now() - lastInteraction) / 1000;
        if (idleSec > 12) { nap(); }
        else if (idleSec > 7) {
          if (idleState !== 'hungry') { idleState = 'hungry'; yawn(); }
          else if (Math.random() < 0.4) { spawnText('meow?', '#ffffff', 0.7, 0.95, 700); }
        } else if (idleSec > 3) {
          if (idleState !== 'bored') { idleState = 'bored'; groom(); }
        }
      }, 1000);

      function pet() {
        resetIdle();
        setMood('purring');
        spawnText('purr...', '#ffffff', 0.7, 0.9, 600);
        beep(600, 0.08);
        var pulseScale = scale * 1.06;
        petEl.setAttribute('animation__pulse', {
          property: 'scale', from: scale + ' ' + scale + ' ' + scale,
          to: pulseScale + ' ' + pulseScale + ' ' + pulseScale, dur: 150, dir: 'alternate', loop: 1
        });
        spawnText('❤', '#ff5d8f', 0.6, 1.2, 900);
        closeEyes();
        setTimeout(openEyes, 180);
        setTimeout(function () { setMood('content'); }, 500);
      }

      function doEat() {
        hearts += 1;
        heartsEl.textContent = '❤️ x' + hearts;
        beep(500 + hearts * 8);
        setMood('nom nom');
        spawnSnack();

        setTimeout(function () {
          var bumpScale = scale * 1.08;
          petEl.setAttribute('animation__bump', {
            property: 'scale', from: scale + ' ' + scale + ' ' + scale,
            to: bumpScale + ' ' + bumpScale + ' ' + bumpScale, dur: 150, dir: 'alternate', loop: 1
          });
        }, 380);

        if (hearts % 5 === 0) {
          level += 1;
          levelEl.textContent = 'Level ' + level;
          scale = 1 + (level - 1) * 0.08;
          petEl.setAttribute('scale', scale + ' ' + scale + ' ' + scale);
          beep(800, 0.25);
          if (level === 2) { bandana.setAttribute('scale', '1 1 1'); setMood('new bandana!'); }
          else if (level === 3) { bell.setAttribute('scale', '1 1 1'); setMood('new bell!'); }
          else { setMood('leveled up'); }
        } else {
          setTimeout(function () { setMood('curious'); }, 700);
        }
      }

      function feed() {
        resetIdle();
        if (Math.random() < 0.3) {
          setMood('hmm...');
          spawnText('hmm...', '#ffffff', 0.7, 0.9, 600);
          setTimeout(doEat, 650);
        } else {
          doEat();
        }
      }

      petEl.addEventListener('click', pet);
      document.getElementById('feed-btn').addEventListener('click', feed);
    })();
  </script>
</body>
</html>
